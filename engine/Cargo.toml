[workspace]
resolver = "3"
members = ["crates/paint", "crates/easel"]

[profile.dev]
incremental = true
codegen-units = 256

[profile.release]
opt-level = 3
debug = false
# (claude-paint:) Favor runtime optimization for exports; cross-build pixel drift is bounded
# by the comparison policy in notes/workflow.md, not forbidden by hash.
# Atelier, which forbids it: not incremental. A painting must replay byte-exact with the replay
# easel (REC-4), and anything may rebuild that with a plain `cargo build
# --release` (scripts/replay_easel): an incremental build of the same source
# paints differently from the painter's easel (work i-010, 2026-10-18).
# scripts/tests/release_profile.sh; tools/build-engine.sh sets it too.
incremental = false
codegen-units = 1

# Tests run optimized (the physics tests took ~10 min unoptimized), with
# debug assertions and overflow checks kept on. Incremental codegen favors
# edit/rebuild speed; same-build determinism checks remain exact.
[profile.test]
opt-level = 2
incremental = true
codegen-units = 256
debug-assertions = true
overflow-checks = true

# Development iteration only (`cargo build --profile iter -p easel`, into
# target/iter): release optimizations with many independently reusable units.
# Final exports retain the release profile's runtime optimization.
[profile.iter]
inherits = "release"
incremental = true
codegen-units = 256
