# Step 1 of docs/design-nas-publisher.md: the publisher against a COPY of the store, writing into scratch folders.
# Nothing here touches atelier-site or atelier-backup, and the Mac's own push stays as it is.
# Container Manager -> Project -> Create: name atelier-publisher-test, path /docker/atelier-publisher-test, this file.
name: atelier-publisher-test
services:
  publisher:
    build:
      context: ./repo                                # a checkout of main from Gitea, next to this file
      dockerfile: deploy/nas/publisher/Dockerfile
    pull_policy: build                               # rebuild from repo/ on every start: never yesterday's code
    restart: "no"
    read_only: true
    tmpfs: [/tmp]
    env_file: publisher.env                          # ATELIER_SCRUB_HOME=/Users/<account> (never in the repository)
    environment:
      ATELIER_BACKUP_AT: "07:15"
    volumes:
      - /volume1/atelier-test/data:/data:ro          # the copy of ~/atelier-data
      - /volume1/atelier-test/roots:/Users/Shared:ro  # the artists' roots, each at its Mac path (artists.json names them)
      - /volume1/atelier-test/work:/work
      - /volume1/atelier-test/site:/site
      - /volume1/atelier-test/backup:/backup
      - ./private-words.txt:/config/private-words.txt:ro
    network_mode: none                               # it reads and writes folders; it needs no network
