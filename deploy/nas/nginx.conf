# Served to Cloudflare's tunnel only. No access log: the site keeps nothing about its visitors.
server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    access_log off;
    charset utf-8;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # live data changes every couple of minutes; finished works and images never change
    location /data/ { add_header Cache-Control "public, max-age=60" always; try_files $uri =404; }
    location ~* \.(png|jpg|jpeg|webp|avif|woff2)$ { add_header Cache-Control "public, max-age=604800" always; try_files $uri =404; }
    location / { add_header Cache-Control "public, max-age=300" always; try_files $uri $uri/ =404; }
}
