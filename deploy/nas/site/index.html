<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atelier</title>

<style>
  :root { color-scheme: light dark; --bg: #f4f1ea; --fg: #2b2925; --muted: #7a756b; }
  @media (prefers-color-scheme: dark) { :root { --bg: #171614; --fg: #e8e4da; --muted: #8f897d; } }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); }
  body { display: grid; place-items: center; font: 17px/1.6 Georgia, "Times New Roman", serif; padding: 0 16px; }
  main { max-width: 32rem; text-align: center; }
  h1 { font-weight: normal; letter-spacing: .08em; margin: 0 0 .4em; }
  p { color: var(--muted); margin: 0; }
</style>
</head>
<body>
<main>
  <h1>Atelier</h1>
  <p>Three studios. The paint is still wet.</p>
</main>
</body>
</html>
